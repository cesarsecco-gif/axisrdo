# =============================================================
# AXIS RDO — Nginx VirtualHost para VPS Hostinger
# Axis Consultoria e Planejamento
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Desafio de renovação e emissão de SSL do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Limite aumentado para upload de fotos de alta resolução e relatórios
    client_max_body_size 500M;

    # Encaminhamento para a aplicação Node.js (AXIS RDO)
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Suporte a WebSockets / Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Cabeçalhos padrão de Proxy Reverso
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts longos para geração de PDFs com centenas de páginas
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_cache_bypass $http_upgrade;
    }
}
