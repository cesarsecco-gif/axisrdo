# =============================================================
# AXIS RDO — Docker Compose para VPS Hostinger
# Axis Consultoria e Planejamento
# =============================================================

version: '3.8'

services:
  # Aplicação Principal (Node.js + Express + Vite SSR/SPA)
  app:
    build:
      context: ./codigo-fonte
      dockerfile: Dockerfile
    image: axisrdo-app:latest
    container_name: axisrdo_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ALLOW_NETWORK=true
      - DATABASE_URL=file:/app/data/axis_rdo.db
      - JWT_SECRET=${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL:?Configure PLATFORM_ADMIN_EMAIL no arquivo .env}
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD:?Configure PLATFORM_ADMIN_PASSWORD no arquivo .env}
      - AXIS_DATA_DIR=/app/data
    volumes:
      - axis_data:/app/data
    networks:
      - axis_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Reverse Proxy Nginx com suporte a SSL / Let's Encrypt
  nginx:
    image: nginx:alpine
    container_name: axisrdo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - axis_network

  # Renovação Automática de Certificado SSL (Let's Encrypt)
  certbot:
    image: certbot/certbot:latest
    container_name: axisrdo_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

networks:
  axis_network:
    driver: bridge

volumes:
  axis_data:
    driver: local
